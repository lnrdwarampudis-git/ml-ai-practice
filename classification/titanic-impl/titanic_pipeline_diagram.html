<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Titanic ML Pipeline — Interactive Flow Diagram</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #f5f4f0;
    color: #1a1a18;
    min-height: 100vh;
    padding: 24px 16px 48px;
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    color: #1a1a18;
    margin-bottom: 4px;
    letter-spacing: -0.3px;
  }
  .subtitle {
    font-size: 13px;
    color: #6b6a63;
    margin-bottom: 18px;
  }

  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 18px;
    padding: 10px 14px;
    background: #ffffff;
    border: 0.5px solid #d3d1c7;
    border-radius: 10px;
    font-size: 12px;
    color: #6b6a63;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot {
    width: 12px; height: 12px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  #diagram-root {
    position: relative;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
  }

  svg { display: block; width: 100%; }

  /* Node hover */
  .node-g { cursor: pointer; }
  .node-g:hover rect, .node-g:hover circle { opacity: .88; }
  .node-g rect { transition: opacity .12s; }

  /* Detail panel */
  #detail-panel {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 300px;
    background: #ffffff;
    border: 0.5px solid #b4b2a9;
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    display: none;
    z-index: 100;
  }
  #detail-panel.visible { display: block; }

  #dp-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  #dp-title {
    font-size: 14px;
    font-weight: 600;
    color: #1a1a18;
    line-height: 1.35;
    flex: 1;
    padding-right: 8px;
  }
  .close-btn {
    background: none;
    border: none;
    font-size: 20px;
    color: #888780;
    cursor: pointer;
    line-height: 1;
    padding: 0;
    flex-shrink: 0;
  }
  .close-btn:hover { color: #1a1a18; }
  #dp-desc {
    font-size: 12px;
    color: #5f5e5a;
    line-height: 1.6;
    margin-bottom: 10px;
  }
  #dp-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 20px;
    font-weight: 500;
  }
  .tag-new  { background: #d4edda; color: #1a5c2a; }
  .tag-orig { background: #d4e8f7; color: #0c3f6e; }
  .tag-file { background: #ececea; color: #444441; }
  .tag-warn { background: #fef3cd; color: #7a5a00; }

  /* Section labels */
  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  @media (max-width: 600px) {
    #detail-panel { width: calc(100vw - 32px); right: 16px; }
  }
</style>
</head>
<body>

<div id="diagram-root">
  <h1>Titanic ML Pipeline</h1>
  <p class="subtitle">Click any node to see implementation details · Colors indicate module type</p>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#1d9e75"></div>Original logic</div>
    <div class="legend-item"><div class="legend-dot" style="background:#534ab7"></div>New improvements</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ba7517"></div>Output artifacts</div>
    <div class="legend-item"><div class="legend-dot" style="background:#993556"></div>Optional / graceful</div>
    <div class="legend-item"><div class="legend-dot" style="background:#444441"></div>CLI entry</div>
  </div>

  <svg id="flow-svg" viewBox="0 0 860 1640" role="img" aria-label="Titanic ML pipeline interactive flow diagram">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#888780"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#534ab7"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="arr-pink" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#993556"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- ══════════════════════════════════════════ -->
    <!-- SECTION LABELS -->
    <!-- ══════════════════════════════════════════ -->
    <text x="30"  y="188" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="0.8" fill="#1d9e75">TRAIN</text>
    <text x="270" y="188" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="0.8" fill="#888780">SAMPLE-INPUT</text>
    <text x="450" y="188" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="0.8" fill="#1d9e75">PREDICT</text>
    <text x="680" y="188" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="0.8" fill="#1d9e75">MONITOR</text>

    <!-- Dividers -->
    <line x1="248" y1="180" x2="248" y2="1620" stroke="#d3d1c7" stroke-width="0.5" stroke-dasharray="4 4"/>
    <line x1="435" y1="180" x2="435" y2="1620" stroke="#d3d1c7" stroke-width="0.5" stroke-dasharray="4 4"/>
    <line x1="660" y1="180" x2="660" y2="1620" stroke="#d3d1c7" stroke-width="0.5" stroke-dasharray="4 4"/>

    <!-- ══════════════════════════════════════════ -->
    <!-- ROW 0: CLI -->
    <!-- ══════════════════════════════════════════ -->
    <g class="node-g" onclick="showPanel('cli')">
      <rect x="270" y="20" width="300" height="46" rx="8" fill="#2c2c2a" stroke="#444441" stroke-width="0.5"/>
      <text x="420" y="40" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#f1efe8">CLI entry point</text>
      <text x="420" y="57" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#b4b2a9">parse_args + main()</text>
    </g>

    <!-- CLI → four commands fan: train(100) sample(330) predict(540) monitor(770) -->
    <line x1="420" y1="66" x2="420" y2="78" stroke="#888780" stroke-width="1"/>
    <line x1="100" y1="78" x2="770" y2="78" stroke="#888780" stroke-width="0.5"/>
    <line x1="100" y1="78" x2="100" y2="200" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="330" y1="78" x2="330" y2="200" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="540" y1="78" x2="540" y2="200" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="770" y1="78" x2="770" y2="200" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

    <!-- ══════════════════════════════════════════ -->
    <!-- ROW 1: Sub-commands -->
    <!-- ══════════════════════════════════════════ -->
    <!-- train (x=30..170, cx=100) -->
    <g class="node-g" onclick="showPanel('train-cmd')">
      <rect x="30" y="200" width="140" height="44" rx="8" fill="#0f6e56" stroke="#1d9e75" stroke-width="0.5"/>
      <text x="100" y="222" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#e1f5ee">train</text>
    </g>
    <!-- sample-input (x=260..400, cx=330) -->
    <g class="node-g" onclick="showPanel('sample-cmd')">
      <rect x="260" y="200" width="140" height="44" rx="8" fill="#444441" stroke="#888780" stroke-width="0.5"/>
      <text x="330" y="222" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#d3d1c7">sample-input</text>
    </g>
    <!-- predict (x=470..610, cx=540) -->
    <g class="node-g" onclick="showPanel('predict-cmd')">
      <rect x="470" y="200" width="140" height="44" rx="8" fill="#0f6e56" stroke="#1d9e75" stroke-width="0.5"/>
      <text x="540" y="222" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#e1f5ee">predict</text>
    </g>
    <!-- monitor (x=700..840, cx=770) -->
    <g class="node-g" onclick="showPanel('monitor-cmd')">
      <rect x="700" y="200" width="140" height="44" rx="8" fill="#0f6e56" stroke="#1d9e75" stroke-width="0.5"/>
      <text x="770" y="222" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#e1f5ee">monitor</text>
    </g>

    <!-- ══════════════════════════════════════════ -->
    <!-- SAMPLE-INPUT PIPELINE (x≈330) -->
    <!-- ══════════════════════════════════════════ -->
    <line x1="330" y1="244" x2="330" y2="276" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

    <!-- load raw data -->
    <g class="node-g" onclick="showPanel('sample-load')">
      <rect x="260" y="276" width="150" height="52" rx="8" fill="#2c2c2a" stroke="#5f5e5a" stroke-width="0.5"/>
      <text x="335" y="296" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#d3d1c7">load_data</text>
      <text x="335" y="312" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#888780">fix_data_types</text>
    </g>
    <line x1="335" y1="328" x2="335" y2="360" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

    <!-- drop target + head(N) -->
    <g class="node-g" onclick="showPanel('sample-drop')">
      <rect x="260" y="360" width="150" height="52" rx="8" fill="#2c2c2a" stroke="#5f5e5a" stroke-width="0.5"/>
      <text x="335" y="380" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#d3d1c7">drop target col</text>
      <text x="335" y="396" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#888780">df.drop(survived).head(N)</text>
    </g>
    <line x1="335" y1="412" x2="335" y2="444" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

    <!-- output CSV -->
    <g class="node-g" onclick="showPanel('sample-out')">
      <rect x="260" y="444" width="150" height="52" rx="8" fill="#412402" stroke="#ba7517" stroke-width="1"/>
      <text x="335" y="464" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#fac775">sample_passengers.csv</text>
      <text x="335" y="480" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#ef9f27">default: 10 rows</text>
    </g>
    <!-- note: feeds predict -->
    <path d="M410 470 L440 470 L440 516 L470 516" fill="none" stroke="#ba7517" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arr)"/>
    <text x="416" y="462" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#888780">feeds predict →</text>

    <!-- ══════════════════════════════════════════ -->
    <!-- TRAIN PIPELINE (x≈100) -->
    <!-- ══════════════════════════════════════════ -->

    <!-- ── load_data ── -->
    <line x1="100" y1="244" x2="100" y2="276" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
    <g class="node-g" onclick="showPanel('load')">
      <rect x="30" y="276" width="210" height="52" rx="8" fill="#085041" stroke="#0f6e56" stroke-width="0.5"/>
      <text x="135" y="296" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#9fe1cb">load_data + fix_data_types</text>
      <text x="135" y="312" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#5dcaa5">OpenML fetch · type cast</text>
    </g>

    <!-- ── split_data ── -->
    <line x1="100" y1="328" x2="100" y2="360" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
    <g class="node-g" onclick="showPanel('split')">
      <rect x="30" y="360" width="210" height="52" rx="8" fill="#085041" stroke="#0f6e56" stroke-width="0.5"/>
      <text x="135" y="380" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#9fe1cb">split_data</text>
      <text x="135" y="396" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#5dcaa5">Stratified 80/20 before EDA</text>
    </g>

    <!-- ── EDA (split feeds EDA + feature pipe) ── -->
    <line x1="100" y1="412" x2="100" y2="444" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
    <g class="node-g" onclick="showPanel('eda')">
      <rect x="30" y="444" width="210" height="52" rx="8" fill="#085041" stroke="#0f6e56" stroke-width="0.5"/>
      <text x="135" y="464" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#9fe1cb">save_research_artifacts</text>
      <text x="135" y="480" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#5dcaa5">EDA on train only</text>
    </g>
    <!-- EDA → output artifact -->
    <path d="M240 470 L270 470 L270 524 L264 524" fill="none" stroke="#ba7517" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arr)"/>
    <g class="node-g" onclick="showPanel('eda-out')">
      <rect x="264" y="508" width="180" height="44" rx="8" fill="#633806" stroke="#ba7517" stroke-width="0.5"/>
      <text x="354" y="526" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#fac775">EDA artifacts</text>
      <text x="354" y="542" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#ef9f27">CSV · PNG · JSON</text>
    </g>

    <!-- ── Feature engineering ── -->
    <line x1="100" y1="496" x2="100" y2="528" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
    <g class="node-g" onclick="showPanel('feat')">
      <rect x="30" y="528" width="210" height="52" rx="8" fill="#085041" stroke="#0f6e56" stroke-width="0.5"/>
      <text x="135" y="548" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#9fe1cb">TitanicFeatureEngineer</text>
      <text x="135" y="564" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#5dcaa5">Title · cabin · ticket · family</text>
    </g>

    <!-- ── Preprocessor ── -->
    <line x1="100" y1="580" x2="100" y2="612" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
    <g class="node-g" onclick="showPanel('preprocess')">
      <rect x="30" y="612" width="210" height="52" rx="8" fill="#085041" stroke="#0f6e56" stroke-width="0.5"/>
      <text x="135" y="632" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#9fe1cb">build_preprocessor</text>
      <text x="135" y="648" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#5dcaa5">Impute · scale · OHE</text>
    </g>

    <!-- ── Feature selection ── -->
    <line x1="100" y1="664" x2="100" y2="696" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
    <g class="node-g" onclick="showPanel('featsel')">
      <rect x="30" y="696" width="210" height="52" rx="8" fill="#085041" stroke="#0f6e56" stroke-width="0.5"/>
      <text x="135" y="716" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#9fe1cb">SelectFromModel</text>
      <text x="135" y="732" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#5dcaa5">ExtraTrees · median threshold</text>
    </g>

    <!-- ── tune_model ── -->
    <line x1="100" y1="748" x2="100" y2="780" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
    <g class="node-g" onclick="showPanel('tunemodel')">
      <rect x="30" y="780" width="210" height="52" rx="8" fill="#085041" stroke="#0f6e56" stroke-width="0.5"/>
      <text x="135" y="800" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#9fe1cb">tune_model</text>
      <text x="135" y="816" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#5dcaa5">RandomizedSearchCV 5-fold</text>
    </g>

    <!-- ── tune_threshold (IMPROVED) ── -->
    <line x1="100" y1="832" x2="100" y2="864" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
    <g class="node-g" onclick="showPanel('tunethresh')">
      <rect x="30" y="864" width="210" height="52" rx="8" fill="#3c3489" stroke="#534ab7" stroke-width="1"/>
      <text x="135" y="884" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#cecbf6">tune_threshold</text>
      <text x="135" y="900" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#afa9ec">OOF · cost-matrix aware ✦</text>
    </g>

    <!-- ── final fit ── -->
    <line x1="100" y1="916" x2="100" y2="948" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
    <g class="node-g" onclick="showPanel('finalfit')">
      <rect x="30" y="948" width="210" height="44" rx="8" fill="#085041" stroke="#0f6e56" stroke-width="0.5"/>
      <text x="135" y="970" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#9fe1cb">final_model.fit</text>
    </g>

    <!-- ── evaluate_predictions ── -->
    <line x1="100" y1="992" x2="100" y2="1024" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
    <g class="node-g" onclick="showPanel('evaluate')">
      <rect x="30" y="1024" width="210" height="52" rx="8" fill="#085041" stroke="#0f6e56" stroke-width="0.5"/>
      <text x="135" y="1044" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#9fe1cb">evaluate_predictions</text>
      <text x="135" y="1060" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#5dcaa5">ROC-AUC · F1 · Brier · PR</text>
    </g>

    <!-- ── save_model_artifacts ── -->
    <line x1="100" y1="1076" x2="100" y2="1108" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
    <g class="node-g" onclick="showPanel('saveartifacts')">
      <rect x="30" y="1108" width="210" height="52" rx="8" fill="#085041" stroke="#0f6e56" stroke-width="0.5"/>
      <text x="135" y="1128" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#9fe1cb">save_model_artifacts</text>
      <text x="135" y="1144" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#5dcaa5">versioned .joblib + profile</text>
    </g>

    <!-- ── outputs block ── -->
    <line x1="100" y1="1160" x2="100" y2="1192" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
    <g class="node-g" onclick="showPanel('outputs')">
      <rect x="30" y="1192" width="420" height="52" rx="8" fill="#412402" stroke="#ba7517" stroke-width="1"/>
      <text x="240" y="1212" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#fac775">All training artifact outputs</text>
      <text x="240" y="1228" text-anchor="middle" dominant-baseline="central"

  const tagsEl = document.getElementById('dp-tags');
  tagsEl.innerHTML = d.tags.map(([label, type]) => {
    const cls = type === 'new' ? 'tag-new' : type === 'file' ? 'tag-file' : type === 'warn' ? 'tag-warn' : 'tag-orig';
    return `<span class="tag ${cls}">${label}</span>`;
  }).join('');
  document.getElementById('detail-panel').classList.add('visible');
}

function hidePanel() {
  document.getElementById('detail-panel').classList.remove('visible');
}

// Close panel when clicking SVG background
document.getElementById('flow-svg').addEventListener('click', function(e) {
  if (e.target === this || e.target.tagName === 'svg') hidePanel();
});
</script>
</body>
</html>
