version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8000:8000"
    environment:
      MODEL_ARTIFACTS_DIR: /app/model_artifacts
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      WORKERS: 2
      DRIFT_WINDOW_SIZE: 50
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_PER_MINUTE: "120"
      API_KEYS_ENABLED: "false"
    volumes:
      - ./model_artifacts:/app/model_artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana_datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      - ./docker/grafana_dashboard_provisioning.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./docker/grafana_dashboard.json:/etc/grafana/provisioning/dashboards/diabetes.json:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  grafana_data:
